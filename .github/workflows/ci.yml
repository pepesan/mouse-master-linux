name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_package:
        description: Force a DEB build and publication without package input changes
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Service, CLI and protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  detect_deb_changes:
    name: Detect DEB package inputs
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      increment: ${{ steps.filter.outputs.increment }}
      create_pr: ${{ steps.filter.outputs.create_pr }}
      publish_ready: ${{ steps.filter.outputs.publish_ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify package changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_PACKAGE: ${{ github.event.inputs.force_package || 'false' }}
        run: |
          set -euo pipefail
          changed=false
          increment=false
          create_pr=false
          publish_ready=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$FORCE_PACKAGE" == "true" ]]; then
              changed=true
              increment=true
              [[ "$GITHUB_REF" != "refs/heads/main" ]] || create_pr=true
            elif [[ "$GITHUB_REF" == "refs/heads/automation/deb-revision" ]]; then
              changed=true
            fi
          else
            base_sha="$PUSH_BASE_SHA"
            [[ "$EVENT_NAME" != "pull_request" ]] || base_sha="$PR_BASE_SHA"
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              changed=true
              increment=true
              if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
                create_pr=true
              fi
              echo "Base commit unavailable; running the DEB matrix conservatively."
            else
              package_changed=false
              metadata_changed=false
              while IFS= read -r path; do
                case "$path" in
                  debian/revision|debian/changelog)
                    metadata_changed=true
                    ;;
                  app/*|crates/*|data/*|debian/*|CMakeLists.txt|Cargo.toml|Cargo.lock|scripts/build-deps.sh|scripts/build-deb.sh)
                    package_changed=true
                    ;;
                esac
              done < <(git diff --name-only "$base_sha" "$GITHUB_SHA")

              if [[ "$package_changed" == "true" ]]; then
                changed=true
                increment=true
                if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
                  create_pr=true
                fi
              elif [[ "$metadata_changed" == "true" ]]; then
                changed=true
                if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
                  publish_ready=true
                fi
              fi
            fi
          fi

          echo "Package build required: $changed"
          echo "Increment package revision: $increment"
          echo "Open revision PR: $create_pr"
          echo "Publish merged revision: $publish_ready"
          {
            echo "changed=$changed"
            echo "increment=$increment"
            echo "create_pr=$create_pr"
            echo "publish_ready=$publish_ready"
          } >> "$GITHUB_OUTPUT"

  package-deb:
    name: DEB package (${{ matrix.distro }})
    needs: detect_deb_changes
    if: needs.detect_deb_changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - distro: Debian 13
            image: debian:13
          - distro: Ubuntu 26.04
            image: ubuntu:26.04
    steps:
      - name: Install checkout prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: ./scripts/build-deps.sh
      - name: Build DEB package
        env:
          INCREMENT_REVISION: ${{ needs.detect_deb_changes.outputs.increment }}
        run: |
          if [[ "$INCREMENT_REVISION" == "true" ]]; then
            ./scripts/build-deb.sh
          else
            ./scripts/build-deb.sh --no-increment
          fi
      - name: Stage DEB artifact
        run: mkdir -p artifacts && cp ../mouse-master_*.deb artifacts/
      - name: Inspect package
        run: |
          dpkg-deb --info ../mouse-master_*.deb
          dpkg-deb --contents ../mouse-master_*.deb
      - name: Install package and smoke-test CLI
        run: |
          package="../mouse-master_$(dpkg-parsechangelog -S Version)_amd64.deb"
          apt-get install -y "$package"
          dpkg-query -W -f='${Status} ${Version}\n' mouse-master | grep -F "install ok installed $(dpkg-parsechangelog -S Version)"
          mouse-masterctl --version
          mouse-masterd --version
      - name: Smoke-test GUI startup
        env:
          QT_QPA_PLATFORM: offscreen
          MM_SCREENSHOT: /tmp/mouse-master.png
          MM_SCREENSHOT_DELAY: "500"
        run: |
          mouse-master
          test -s "$MM_SCREENSHOT"
      - uses: actions/upload-artifact@v4
        with:
          name: mouse-master-${{ matrix.distro }}-${{ github.run_number }}
          path: artifacts/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: deb-metadata-${{ matrix.distro }}
          path: |
            debian/revision
            debian/changelog
          if-no-files-found: error

  deb-package-check:
    name: DEB package validation
    needs: [detect_deb_changes, package-deb]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require DEB matrix when package inputs change
        env:
          DETECT_RESULT: ${{ needs.detect_deb_changes.result }}
          PACKAGE_CHANGED: ${{ needs.detect_deb_changes.outputs.changed }}
          PACKAGE_RESULT: ${{ needs['package-deb'].result }}
        run: |
          set -euo pipefail
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "DEB input detection did not succeed" >&2
            exit 1
          fi
          if [[ "$PACKAGE_CHANGED" == "true" ]]; then
            if [[ "$PACKAGE_RESULT" != "success" ]]; then
              echo "Package inputs changed but the Debian/Ubuntu matrix did not pass" >&2
              exit 1
            fi
          elif [[ "$PACKAGE_RESULT" != "success" && "$PACKAGE_RESULT" != "skipped" ]]; then
            echo "Unexpected DEB matrix result without package input changes: $PACKAGE_RESULT" >&2
            exit 1
          fi

  persist-deb-revision:
    name: Open DEB revision PR
    needs: [detect_deb_changes, package-deb]
    if: needs.detect_deb_changes.outputs.create_pr == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: deb-metadata-Debian 13
          path: generated-debian
      - name: Open or update revision PR and wait for required checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_revision="$(<debian/revision)"
          generated_revision="$(<generated-debian/revision)"
          if [[ ! "$current_revision" =~ ^[0-9]+$ || ! "$generated_revision" =~ ^[0-9]+$ ]]; then
            echo "Invalid DEB revision metadata" >&2
            exit 1
          fi
          if (( generated_revision <= current_revision )); then
            echo "Revision artifact is stale; no revision PR is needed"
            exit 0
          fi

          git fetch origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "This run is stale; main advanced to $main_sha before the revision PR was prepared"
            exit 0
          fi

          branch="automation/deb-revision"
          git switch --create "$branch" "$main_sha"
          cp generated-debian/revision debian/revision
          cp generated-debian/changelog debian/changelog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debian/revision debian/changelog
          if git diff --cached --quiet; then
            echo "No DEB revision update to propose"
            exit 0
          fi
          package_version="$(awk -F '[()]' 'NR == 1 { print $2; exit }' debian/changelog)"
          app_version="$(awk '$1 == "project(mouse-master" { print $3; exit }' CMakeLists.txt)"
          expected_version="${app_version}-${generated_revision}"
          if [[ "$package_version" != "$expected_version" ]]; then
            echo "Generated changelog version $package_version does not match expected $expected_version" >&2
            exit 1
          fi
          git commit -m "ci: propose DEB package revision $package_version"
          git push --force origin "HEAD:refs/heads/$branch"

          title="chore(debian): prepare package revision $package_version"
          body="CI built and smoke-tested both distribution packages for \`$package_version\`. Merge this PR to authorize the Release and APT publication from \`main\`. The merge build will reuse this revision without incrementing it again."
          pr_number="$(gh pr list --base main --head "$GITHUB_REPOSITORY_OWNER:$branch" --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create --base main --head "$GITHUB_REPOSITORY_OWNER:$branch" --title "$title" --body "$body"
          else
            gh pr edit "$pr_number" --title "$title" --body "$body"
          fi

          run_url="$(gh workflow run ci.yml --ref "$branch" -f force_package=false)"
          run_id="${run_url##*/}"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Could not parse revision PR validation run URL: $run_url" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status

  publish-deb-release:
    name: Publish DEB release
    needs: [detect_deb_changes, package-deb]
    if: needs.detect_deb_changes.outputs.publish_ready == 'true' && github.event_name == 'push' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mouse-master-Debian 13-${{ github.run_number }}
          path: dist/debian
      - uses: actions/download-artifact@v4
        with:
          name: mouse-master-Ubuntu 26.04-${{ github.run_number }}
          path: dist/ubuntu
      - name: Prepare release assets
        id: release
        run: |
          set -euo pipefail
          debian_deb="$(find dist/debian -maxdepth 1 -type f -name 'mouse-master_*.deb' -print -quit)"
          ubuntu_deb="$(find dist/ubuntu -maxdepth 1 -type f -name 'mouse-master_*.deb' -print -quit)"
          if [[ -z "$debian_deb" || -z "$ubuntu_deb" ]]; then
            echo "Expected one DEB package for each distribution" >&2
            exit 1
          fi
          debian_version="$(dpkg-deb -f "$debian_deb" Version)"
          ubuntu_version="$(dpkg-deb -f "$ubuntu_deb" Version)"
          if [[ "$debian_version" != "$ubuntu_version" ]]; then
            echo "DEB versions differ: Debian=${debian_version}, Ubuntu=${ubuntu_version}" >&2
            exit 1
          fi
          debian_arch="$(dpkg-deb -f "$debian_deb" Architecture)"
          ubuntu_arch="$(dpkg-deb -f "$ubuntu_deb" Architecture)"
          mv "$debian_deb" "dist/mouse-master_${debian_version}_debian13_${debian_arch}.deb"
          mv "$ubuntu_deb" "dist/mouse-master_${ubuntu_version}_ubuntu26.04_${ubuntu_arch}.deb"
          echo "version=$debian_version" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: deb-${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mouse Master DEB ${{ steps.release.outputs.version }}
          body: |
            Packages:
            - Debian 13 (amd64): `mouse-master_${{ steps.release.outputs.version }}_debian13_amd64.deb`
            - Ubuntu 26.04 (amd64): `mouse-master_${{ steps.release.outputs.version }}_ubuntu26.04_amd64.deb`
            Install the downloaded package with `sudo apt install ./<package-file>`.
          files: dist/*.deb
          fail_on_unmatched_files: true
          overwrite_files: true


  publish-apt:
    name: Publish signed APT repository
    needs: [detect_deb_changes, package-deb]
    if: needs.detect_deb_changes.outputs.publish_ready == 'true' && github.event_name == 'push' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: apt-publish
    outputs:
      version: ${{ steps.packages.outputs.version }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: mouse-master-Debian 13-${{ github.run_number }}
          path: dist/debian
      - uses: actions/download-artifact@v4
        with:
          name: mouse-master-Ubuntu 26.04-${{ github.run_number }}
          path: dist/ubuntu
      - name: Validate and name distribution artifacts
        id: packages
        run: |
          set -euo pipefail
          debian_packages=(dist/debian/*.deb)
          ubuntu_packages=(dist/ubuntu/*.deb)
          if [[ ${#debian_packages[@]} -ne 1 || ! -f ${debian_packages[0]} ]]; then
            echo "Expected exactly one Debian 13 package artifact" >&2
            exit 1
          fi
          if [[ ${#ubuntu_packages[@]} -ne 1 || ! -f ${ubuntu_packages[0]} ]]; then
            echo "Expected exactly one Ubuntu 26.04 package artifact" >&2
            exit 1
          fi
          debian_version="$(dpkg-deb -f "${debian_packages[0]}" Version)"
          ubuntu_version="$(dpkg-deb -f "${ubuntu_packages[0]}" Version)"
          [[ "$debian_version" == "$ubuntu_version" ]] || {
            echo "Debian and Ubuntu artifact versions differ" >&2
            exit 1
          }
          [[ "$(dpkg-deb -f "${debian_packages[0]}" Package)" == mouse-master ]]
          [[ "$(dpkg-deb -f "${ubuntu_packages[0]}" Package)" == mouse-master ]]
          [[ "$(dpkg-deb -f "${debian_packages[0]}" Architecture)" == amd64 ]]
          [[ "$(dpkg-deb -f "${ubuntu_packages[0]}" Architecture)" == amd64 ]]
          [[ "$debian_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          debian_name="mouse-master_${debian_version}_debian13_amd64.deb"
          ubuntu_name="mouse-master_${ubuntu_version}_ubuntu26.04_amd64.deb"
          mv "${debian_packages[0]}" "dist/$debian_name"
          mv "${ubuntu_packages[0]}" "dist/$ubuntu_name"
          {
            echo "version=$debian_version"
            echo "debian_name=$debian_name"
            echo "ubuntu_name=$ubuntu_name"
          } >> "$GITHUB_OUTPUT"
      - name: Send packages to Rivendel
        env:
          RIVENDEL_SSH_PRIVATE_KEY: ${{ secrets.RIVENDEL_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$RIVENDEL_SSH_PRIVATE_KEY" ]]; then
            echo "Configure RIVENDEL_SSH_PRIVATE_KEY in the apt-publish environment" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/rivendel-apt-publisher"
          printf '%s\n' "$RIVENDEL_SSH_PRIVATE_KEY" > "$key_file"
          chmod 0600 "$key_file"
          trap 'rm -f -- "$key_file"' EXIT
          cp packaging/apt/site/index.html dist/index.html
          tar -czf - -C dist "${{ steps.packages.outputs.debian_name }}" "${{ steps.packages.outputs.ubuntu_name }}" index.html |
            ssh -i "$key_file" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=packaging/apt/known_hosts \
              -T apt-publisher@rivendel.cursosdedesarrollo.com

  verify-apt:
    name: Verify APT install (${{ matrix.distro }})
    needs: [publish-apt]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - distro: Debian 13
            image: debian:13
            suite: trixie
          - distro: Ubuntu 26.04
            image: ubuntu:26.04
            suite: resolute
    env:
      APT_SUITE: ${{ matrix.suite }}
      PACKAGE_VERSION: ${{ needs.publish-apt.outputs.version }}
    steps:
      - name: Install repository client tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
      - name: Configure signed APT source
        run: |
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSLo /etc/apt/keyrings/cursos-repo.gpg https://repo.cursosdedesarrollo.com/apt/mouse-master/cursos-repo.gpg
          chmod 0644 /etc/apt/keyrings/cursos-repo.gpg
          printf 'deb [arch=amd64 signed-by=/etc/apt/keyrings/cursos-repo.gpg] https://repo.cursosdedesarrollo.com/apt/mouse-master %s main\n' "$APT_SUITE" > /etc/apt/sources.list.d/mouse-master.list
      - name: Verify metadata is public and install exact package
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://repo.cursosdedesarrollo.com/apt/mouse-master/dists/${APT_SUITE}/InRelease")"
          test "$status" = 200
          apt-get update
          apt-get install -y "mouse-master=${PACKAGE_VERSION}"
          dpkg-query -W -f='${Status} ${Version}\n' mouse-master | grep -F "install ok installed ${PACKAGE_VERSION}"
          mouse-masterctl --version

  build:
    name: Full build (Arch Linux, Qt 6)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake rust qt6-base qt6-declarative qt6-svg
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
      - name: Install into a staging directory
        run: DESTDIR="$PWD/stage" cmake --install build && find stage -type f | sort
      - name: Lint QML
        run: |
          /usr/lib/qt6/bin/qmllint -I build/app --bare app/qml/*.qml app/qml/*/*.qml || true
