name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_package:
        description: Force a DEB build and publication without package input changes
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Service, CLI and protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  detect_deb_changes:
    name: Detect DEB package inputs
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed package inputs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_PACKAGE: ${{ github.event.inputs.force_package || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=false
            [[ "$FORCE_PACKAGE" != "true" ]] || changed=true
          else
            base_sha="$PUSH_BASE_SHA"
            [[ "$EVENT_NAME" != "pull_request" ]] || base_sha="$PR_BASE_SHA"
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              changed=true
              echo "Base commit unavailable; running the DEB matrix conservatively."
            else
              changed=false
              while IFS= read -r path; do
                case "$path" in
                  app/*|crates/*|data/*|debian/*|CMakeLists.txt|Cargo.toml|Cargo.lock|scripts/build-deps.sh|scripts/build-deb.sh)
                    changed=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
            fi
          fi
          echo "Package inputs changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  package-deb:
    name: DEB package (${{ matrix.distro }})
    needs: detect_deb_changes
    if: needs.detect_deb_changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - distro: Debian 13
            image: debian:13
          - distro: Ubuntu 26.04
            image: ubuntu:26.04
    steps:
      - name: Install checkout prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: ./scripts/build-deps.sh
      - name: Build DEB with incremented package revision
        run: ./scripts/build-deb.sh
      - name: Stage DEB artifact
        run: mkdir -p artifacts && cp ../mouse-master_*.deb artifacts/
      - name: Inspect package
        run: |
          dpkg-deb --info ../mouse-master_*.deb
          dpkg-deb --contents ../mouse-master_*.deb
      - name: Install package and smoke-test CLI
        run: |
          package="../mouse-master_$(dpkg-parsechangelog -S Version)_amd64.deb"
          apt-get install -y "$package"
          dpkg-query -W -f='${Status} ${Version}\n' mouse-master | grep -F "install ok installed $(dpkg-parsechangelog -S Version)"
          mouse-masterctl --version
          mouse-masterd --version
      - name: Smoke-test GUI startup
        env:
          QT_QPA_PLATFORM: offscreen
          MM_SCREENSHOT: /tmp/mouse-master.png
          MM_SCREENSHOT_DELAY: "500"
        run: |
          mouse-master
          test -s "$MM_SCREENSHOT"
      - uses: actions/upload-artifact@v4
        with:
          name: mouse-master-${{ matrix.distro }}-${{ github.run_number }}
          path: artifacts/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: deb-metadata-${{ matrix.distro }}
          path: |
            debian/revision
            debian/changelog
          if-no-files-found: error

  persist-deb-revision:
    name: Persist DEB revision
    needs: package-deb
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: deb-metadata-Debian 13
          path: generated-debian
      - name: Persist generated revision and changelog
        run: |
          current_revision="$(<debian/revision)"
          generated_revision="$(<generated-debian/revision)"
          if [[ ! "$current_revision" =~ ^[0-9]+$ || ! "$generated_revision" =~ ^[0-9]+$ ]]; then
            echo "Invalid DEB revision metadata" >&2
            exit 1
          fi
          if (( generated_revision <= current_revision )); then
            echo "Revision artifact is stale; repository already has revision ${current_revision}"
            exit 0
          fi
          cp generated-debian/revision debian/revision
          cp generated-debian/changelog debian/changelog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debian/revision debian/changelog
          if git diff --cached --quiet; then
            echo "No DEB revision update to persist"
            exit 0
          fi
          git commit -m "ci: persist DEB package revision [skip ci]"
          git push

  publish-deb-release:
    name: Publish DEB release
    needs: [package-deb, persist-deb-revision]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mouse-master-Debian 13-${{ github.run_number }}
          path: dist/debian
      - uses: actions/download-artifact@v4
        with:
          name: mouse-master-Ubuntu 26.04-${{ github.run_number }}
          path: dist/ubuntu
      - name: Prepare release assets
        id: release
        run: |
          set -euo pipefail
          debian_deb="$(find dist/debian -maxdepth 1 -type f -name 'mouse-master_*.deb' -print -quit)"
          ubuntu_deb="$(find dist/ubuntu -maxdepth 1 -type f -name 'mouse-master_*.deb' -print -quit)"
          if [[ -z "$debian_deb" || -z "$ubuntu_deb" ]]; then
            echo "Expected one DEB package for each distribution" >&2
            exit 1
          fi
          debian_version="$(dpkg-deb -f "$debian_deb" Version)"
          ubuntu_version="$(dpkg-deb -f "$ubuntu_deb" Version)"
          if [[ "$debian_version" != "$ubuntu_version" ]]; then
            echo "DEB versions differ: Debian=${debian_version}, Ubuntu=${ubuntu_version}" >&2
            exit 1
          fi
          debian_arch="$(dpkg-deb -f "$debian_deb" Architecture)"
          ubuntu_arch="$(dpkg-deb -f "$ubuntu_deb" Architecture)"
          mv "$debian_deb" "dist/mouse-master_${debian_version}_debian13_${debian_arch}.deb"
          mv "$ubuntu_deb" "dist/mouse-master_${ubuntu_version}_ubuntu26.04_${ubuntu_arch}.deb"
          echo "version=$debian_version" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: deb-${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mouse Master DEB ${{ steps.release.outputs.version }}
          body: |
            Packages:
            - Debian 13 (amd64): `mouse-master_${{ steps.release.outputs.version }}_debian13_amd64.deb`
            - Ubuntu 26.04 (amd64): `mouse-master_${{ steps.release.outputs.version }}_ubuntu26.04_amd64.deb`
            Install the downloaded package with `sudo apt install ./<package-file>`.
          files: dist/*.deb
          fail_on_unmatched_files: true
          overwrite_files: true


  publish-apt:
    name: Publish signed APT repository
    needs: [package-deb, persist-deb-revision]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: apt-publish
    outputs:
      version: ${{ steps.packages.outputs.version }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: mouse-master-Debian 13-${{ github.run_number }}
          path: dist/debian
      - uses: actions/download-artifact@v4
        with:
          name: mouse-master-Ubuntu 26.04-${{ github.run_number }}
          path: dist/ubuntu
      - name: Validate and name distribution artifacts
        id: packages
        run: |
          set -euo pipefail
          debian_packages=(dist/debian/*.deb)
          ubuntu_packages=(dist/ubuntu/*.deb)
          if [[ ${#debian_packages[@]} -ne 1 || ! -f ${debian_packages[0]} ]]; then
            echo "Expected exactly one Debian 13 package artifact" >&2
            exit 1
          fi
          if [[ ${#ubuntu_packages[@]} -ne 1 || ! -f ${ubuntu_packages[0]} ]]; then
            echo "Expected exactly one Ubuntu 26.04 package artifact" >&2
            exit 1
          fi
          debian_version="$(dpkg-deb -f "${debian_packages[0]}" Version)"
          ubuntu_version="$(dpkg-deb -f "${ubuntu_packages[0]}" Version)"
          [[ "$debian_version" == "$ubuntu_version" ]] || {
            echo "Debian and Ubuntu artifact versions differ" >&2
            exit 1
          }
          [[ "$(dpkg-deb -f "${debian_packages[0]}" Package)" == mouse-master ]]
          [[ "$(dpkg-deb -f "${ubuntu_packages[0]}" Package)" == mouse-master ]]
          [[ "$(dpkg-deb -f "${debian_packages[0]}" Architecture)" == amd64 ]]
          [[ "$(dpkg-deb -f "${ubuntu_packages[0]}" Architecture)" == amd64 ]]
          [[ "$debian_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          debian_name="mouse-master_${debian_version}_debian13_amd64.deb"
          ubuntu_name="mouse-master_${ubuntu_version}_ubuntu26.04_amd64.deb"
          mv "${debian_packages[0]}" "dist/$debian_name"
          mv "${ubuntu_packages[0]}" "dist/$ubuntu_name"
          {
            echo "version=$debian_version"
            echo "debian_name=$debian_name"
            echo "ubuntu_name=$ubuntu_name"
          } >> "$GITHUB_OUTPUT"
      - name: Send packages to Rivendel
        env:
          RIVENDEL_SSH_PRIVATE_KEY: ${{ secrets.RIVENDEL_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$RIVENDEL_SSH_PRIVATE_KEY" ]]; then
            echo "Configure RIVENDEL_SSH_PRIVATE_KEY in the apt-publish environment" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/rivendel-apt-publisher"
          printf '%s\n' "$RIVENDEL_SSH_PRIVATE_KEY" > "$key_file"
          chmod 0600 "$key_file"
          trap 'rm -f -- "$key_file"' EXIT
          cp packaging/apt/site/index.html dist/index.html
          tar -czf - -C dist "${{ steps.packages.outputs.debian_name }}" "${{ steps.packages.outputs.ubuntu_name }}" index.html |
            ssh -i "$key_file" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=packaging/apt/known_hosts \
              -T apt-publisher@rivendel.cursosdedesarrollo.com

  verify-apt:
    name: Verify APT install (${{ matrix.distro }})
    needs: [publish-apt]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - distro: Debian 13
            image: debian:13
            suite: trixie
          - distro: Ubuntu 26.04
            image: ubuntu:26.04
            suite: resolute
    env:
      APT_SUITE: ${{ matrix.suite }}
      PACKAGE_VERSION: ${{ needs.publish-apt.outputs.version }}
    steps:
      - name: Install repository client tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
      - name: Configure signed APT source
        run: |
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSLo /etc/apt/keyrings/cursos-repo.gpg https://repo.cursosdedesarrollo.com/apt/mouse-master/cursos-repo.gpg
          chmod 0644 /etc/apt/keyrings/cursos-repo.gpg
          printf 'deb [arch=amd64 signed-by=/etc/apt/keyrings/cursos-repo.gpg] https://repo.cursosdedesarrollo.com/apt/mouse-master %s main\n' "$APT_SUITE" > /etc/apt/sources.list.d/mouse-master.list
      - name: Verify metadata is public and install exact package
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://repo.cursosdedesarrollo.com/apt/mouse-master/dists/${APT_SUITE}/InRelease")"
          test "$status" = 200
          apt-get update
          apt-get install -y "mouse-master=${PACKAGE_VERSION}"
          dpkg-query -W -f='${Status} ${Version}\n' mouse-master | grep -F "install ok installed ${PACKAGE_VERSION}"
          mouse-masterctl --version

  build:
    name: Full build (Arch Linux, Qt 6)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake rust qt6-base qt6-declarative qt6-svg
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
      - name: Install into a staging directory
        run: DESTDIR="$PWD/stage" cmake --install build && find stage -type f | sort
      - name: Lint QML
        run: |
          /usr/lib/qt6/bin/qmllint -I build/app --bare app/qml/*.qml app/qml/*/*.qml || true
